# dnsmasq configuration for Mac 1 (private DNS)
# Runtime host: 10.3.3.96
#
# This file is a portable template. Copy or symlink it to the location
# dnsmasq actually reads on Mac 1 (often /usr/local/etc/dnsmasq.conf
# or /opt/homebrew/etc/dnsmasq.conf). Do not apply it blindly on a
# laptop that is currently using a different DNS setup.
#
# Private names point at the Nginx edge (Mac 2). Other queries may be
# forwarded so LAN clients can still resolve public names while Mac 1
# is their resolver. Upstream forwarding is optional; comment the
# server= lines if you want a strictly local zone only.

listen-address=10.3.3.96
listen-address=127.0.0.1
bind-interfaces
port=53

domain-needed
bogus-priv
no-hosts

# Application records — both names terminate on Nginx
address=/app.teamX.test/10.3.3.178
address=/api.teamX.test/10.3.3.178

# Optional public resolvers used when dnsmasq is the LAN DNS
server=8.8.8.8
server=1.1.1.1
